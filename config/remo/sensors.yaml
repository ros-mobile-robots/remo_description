# mesh: a file name relative to meshes/sensors, or a full package:// URI for a mesh from another
# package. The laser scanner and the Raspberry Pi camera come from the package
# robot_component_models (https://github.com/ros-mobile-robots/robot_component_models). Its
# meshes are in metres and have no scale.
# rgba: the part's colour in RViz and Gazebo, close to the real part (red, green, blue and
# alpha, from 0 to 1). A COLLADA mesh (.dae) shows its own colours instead. Then rgba is the
# colour of the simple shape that an empty mesh gives.
laser:
  mass: 0.17          # Motor mass in Kg (~170g)
  radius: 0.015     # Wheel radius in m
  length: 0.01      # Wheel length in m, considering is as a cylinder
  mesh: 'package://robot_component_models/meshes/rplidar_a2/rplidar_a2.dae'  # Mesh, or '' for a cylinder
  #mesh: ''
  dx: 0.002
  dy: 0.0
  dz: 0.07
  angular_range:
    min: -3.1415
    max: 3.1415
  enable_gpu: false
  rgba: '0.10 0.10 0.10 1'  # Black RPLidar A2


camera:
  mass: 0.01
  radius: 0.015
  length: 0.01
  type: raspi-cam # choose one camera type [raspi-cam, oak-1, oak-d]
  dx: 0.0
  dy: 0.0
  dz: 0.0
  meshes: # Mesh per camera type, or '' for a cylinder
    raspi-cam: 'package://robot_component_models/meshes/raspberry_pi_camera_v2/raspberry_pi_camera_v2.dae'
    oak-1: BW1093_REV2_20201014.stl
    oak-d: OAK-D-parts-14sep2020.stl
  scale: # Scale per camera type whose mesh isn't in metres. The OAK meshes are in millimetres
    oak-1: '0.001 0.001 0.001'
    oak-d: '0.001 0.001 0.001'
  rgba: # One colour per camera type
    raspi-cam: '0.10 0.42 0.22 1'  # Green PCB of the Raspberry Pi camera module
    oak-1: '0.25 0.25 0.27 1'      # Dark grey aluminium housing
    oak-d: '0.25 0.25 0.27 1'      # Dark grey aluminium housing


imu:
  mass: 0.003  # Weighed: 3 g, the BNO055 board with its header pins
  size:
    x: 0.001
    y: 0.001
    z: 0.001
  #type: 'mpu' # choose one camera type [mpu, bosch]
  dx: 0.0
  dy: 0.0
  dz: 0.0
  mesh: '../components/bno055.stl' # Mesh file, or '' for a box
  #mesh: ''
  scale: '0.001 0.001 0.001'
  rgba: '0.10 0.30 0.65 1'  # Blue PCB of the Adafruit BNO055 breakout
