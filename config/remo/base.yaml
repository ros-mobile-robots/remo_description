# rgba: the part's colour in RViz and Gazebo, close to the real part (red, green, blue and
# alpha, from 0 to 1).
base:
  mass: 0.078               # Base mass in Kg (78 g)
  x_size: 0.14           # Dimension in x axis
  y_size: 0.08            # Dimension in y axis
  z_size: 0.03           # Dimension in z axis
  mesh: 'chassis.stl'  # Mesh file, or '' for a box
  #mesh: ''
  rgba: '0.12 0.12 0.12 1'  # Printed in black filament, dark grey so the shape still shows

jetson_deck:
  mass: 0.02               # Base mass in Kg (20 g)
  x_size: 0.14           # Dimension in x axis
  y_size: 0.09            # Dimension in y axis
  z_size: 0.002           # Dimension in z axis
  mesh: 'deck/jetson_nano_deck.stl'  # Mesh file, or '' for a box
  #mesh: ''
  scale: '0.001 0.001 0.001'
  rgba: '0.12 0.12 0.12 1'  # Printed in black filament, dark grey so the shape still shows

