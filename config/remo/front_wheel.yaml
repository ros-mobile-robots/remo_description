# rgba: the part's colour in RViz and Gazebo, close to the real part (red, green, blue and
# alpha, from 0 to 1).
mass: 0.032        # Wheel mass in Kg (32 g)
radius: 0.0330    # Wheel radius in m, measured: diameters 65.5 mm (one wheel) and 66.5 mm (the other)
length: 0.025     # Wheel length in m, considering is as a cylinder
# The wheel's mesh, or '' for a cylinder. wheel_colours.dae is one mesh with two materials, a
# yellow rim and a black tyre like the real wheel. wheel.stl is the same wheel without colours.
mesh: '../components/wheel_colours.dae'
#mesh: '../components/wheel.stl'
#mesh: ''
# true: the wheel shows the mesh's own colours, so it gets no material from rgba. A material
# from rgba would colour the whole wheel alike in Gazebo, rim and tyre. false for a mesh
# without colours, such as wheel.stl.
mesh_colours: true
# Black like the rubber tyre. The colour of the cylinder, and of a mesh without colours
# (mesh_colours false). rgba doesn't change the colours in wheel_colours.dae.
rgba: '0.10 0.10 0.10 1'
scale: ''
x_offset: 0.034
y_offset: 0.0195  # Gives the measured wheel separation of 0.144 m, center to center: base y_size 0.08 + 2 * (y_offset + length / 2)
z_offset: -0.0336
