# mesh: a file name relative to meshes/remo, or a full package:// URI for a mesh from another
# package. The wheel comes from the package robot_component_models
# (https://github.com/ros-mobile-robots/robot_component_models). Its meshes are in metres and
# have no scale.
mass: 0.032        # Wheel mass in Kg (32 g)
radius: 0.0330    # Wheel radius in m, measured: diameters 65.5 mm (one wheel) and 66.5 mm (the other)
length: 0.025     # Wheel length in m, considering is as a cylinder
mesh: 'package://robot_component_models/meshes/tt_motor_wheel_65mm/tt_motor_wheel_65mm.dae'  # Mesh, or '' for a cylinder
#mesh: ''
# rgba: the colour in RViz and Gazebo (red, green, blue and alpha, from 0 to 1) of a mesh without
# colours of its own, and of the cylinder that an empty mesh gives: black like the rubber tyre.
# The COLLADA mesh (.dae) shows its own colours, a yellow rim in a black tyre.
rgba: '0.10 0.10 0.10 1'
scale: ''
x_offset: 0.034
y_offset: 0.0195  # Gives the measured wheel separation of 0.144 m, center to center: base y_size 0.08 + 2 * (y_offset + length / 2)
z_offset: -0.0336
